name: Build test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hugo-version: ["0.158.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true
      - run: pnpm assets
      - run: pnpm build
      - run: |
          hugo new site testsite --format=toml
          ln -s "$GITHUB_WORKSPACE" testsite/themes/koralyte
          echo 'theme = "koralyte"' >> testsite/hugo.toml
      - run: hugo --minify
        working-directory: testsite
