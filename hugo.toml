# -- Theme Configuration for Koralyte --
# baseURL = "https://your-domain-and-tld/"
defaultContentLanguage = 'en'
enableRobotsTXT = true
summaryLength = 0
enableEmoji = true

[module]
  [module.hugoVersion]
    extended = true
    min = '0.158.0'

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = 'tags'

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section  = ['HTML', 'RSS']
  taxonomy = ['HTML']
  term     = ['HTML']

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = 'tags'
    weight = 100

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false

      [markup.goldmark.parser.attribute]
        block = true

    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

  [markup.highlight]
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  defaultAppearance = 'light'
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  disableImageOptimization = true
  disableImageZoom = false
  disableTextInHeader = false
  enableStyledScrollbar = true
  fingerprintAlgorithm = 'sha512'
  mainSections = ['posts']
  showAppearanceSwitcher = true
  smartTOC = true

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showScrollToTop = true

  [params.homepage]
    showRecent = false
    showRecentItems = 5
    showMoreLink = false
    showMoreLinkDest = '/posts/'

  [params.article]
    showDate = true
    showDateUpdated = true
    showAuthor = true
    showDraftLabel = true
    showHeadingAnchors = true
    showPagination = true
    invertPagination = false
    showReadingTime = true
    readingSpeed = 200
    showTableOfContents = true
    showTaxonomies = true
    showRelatedContent = true
    relatedContentLimit = 3
    externalLinkForceNewTab = true

  [params.list]
    showSummary = true
    showCards = true

  [params.sitemap]
    excludedKinds = ['taxonomy', 'term']

  [params.taxonomy]
    showTermCount = true
